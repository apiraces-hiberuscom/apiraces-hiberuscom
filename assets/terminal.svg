  <text clip-path="url(#c0)" x="213" y="104" fill="#F0F6FC" textLength="61" lengthAdjust="spacingAndGlyphs">whoami</text>
  <text x="40" y="133" opacity="0" textLength="714" lengthAdjust="spacingAndGlyphs"><set attributeName="opacity" to="1" begin="1.70s" fill="freeze"/><tspan fill="#F0F6FC">Alejandro Piracés Pérez</tspan><tspan fill="#8B949E"> — Software Engineer &amp; Certified Ethical Hacker</tspan></text>
  <text x="40" y="175" opacity="0"><set attributeName="opacity" to="1" begin="1.82s" fill="freeze"/><tspan fill="#00C896">alejandro</tspan><tspan fill="#8B949E">@</tspan><tspan fill="#58A6FF">sec</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#A371F7">~</tspan><tspan fill="#8B949E">$ </tspan></text>
  <text clip-path="url(#c3)" x="213" y="175" fill="#F0F6FC" textLength="122" lengthAdjust="spacingAndGlyphs">cat about.md</text>
  <text x="40" y="204" opacity="0" textLength="734" lengthAdjust="spacingAndGlyphs"><set attributeName="opacity" to="1" begin="3.02s" fill="freeze"/><tspan fill="#C9D1D9">Curiosity drives everything I build. I don't settle for making it work —</tspan></text>
  <text x="40" y="233" opacity="0" textLength="571" lengthAdjust="spacingAndGlyphs"><set attributeName="opacity" to="1" begin="3.14s" fill="freeze"/><tspan fill="#C9D1D9">I study how it </tspan><tspan fill="#58A6FF">works</tspan><tspan fill="#C9D1D9">, how it </tspan><tspan fill="#A371F7">breaks</tspan><tspan fill="#C9D1D9">, and how it </tspan><tspan fill="#00C896">evolves</tspan><tspan fill="#C9D1D9">.</tspan></text>
  <text x="40" y="262" opacity="0" textLength="612" lengthAdjust="spacingAndGlyphs"><set attributeName="opacity" to="1" begin="3.26s" fill="freeze"/><tspan fill="#C9D1D9">That mindset separates working software from great software.</tspan></text>
  <text x="40" y="304" opacity="0"><set attributeName="opacity" to="1" begin="3.38s" fill="freeze"/><tspan fill="#00C896">alejandro</tspan><tspan fill="#8B949E">@</tspan><tspan fill="#58A6FF">sec</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#A371F7">~</tspan><tspan fill="#8B949E">$ </tspan></text>
  <text clip-path="url(#c8)" x="213" y="304" fill="#F0F6FC" textLength="122" lengthAdjust="spacingAndGlyphs">cat path.yml</text>
  <text x="40" y="333" opacity="0" textLength="449" lengthAdjust="spacingAndGlyphs"><set attributeName="opacity" to="1" begin="4.58s" fill="freeze"/><tspan fill="#58A6FF">army:     </tspan><tspan fill="#8B949E">leadership, discipline, operations</tspan></text>
  <text x="40" y="362" opacity="0" textLength="653" lengthAdjust="spacingAndGlyphs"><set attributeName="opacity" to="1" begin="4.70s" fill="freeze"/><tspan fill="#A371F7">software: </tspan><tspan fill="#8B949E">.NET · Python · Angular · Swift · Android · Azure · AI</tspan></text>
  <text x="40" y="391" opacity="0" textLength="663" lengthAdjust="spacingAndGlyphs"><set attributeName="opacity" to="1" begin="4.82s" fill="freeze"/><tspan fill="#00C896">security: </tspan><tspan fill="#8B949E">ethical hacking · offensive security · secure-by-design</tspan></text>
  <text x="40" y="433" opacity="0"><set attributeName="opacity" to="1" begin="4.94s" fill="freeze"/><tspan fill="#00C896">alejandro</tspan><tspan fill="#8B949E">@</tspan><tspan fill="#58A6FF">sec</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#A371F7">~</tspan><tspan fill="#8B949E">$ </tspan></text>
  <text clip-path="url(#c13)" x="213" y="433" fill="#F0F6FC" textLength="286" lengthAdjust="spacingAndGlyphs">sudo ./verify --cert ceh-v13</text>
  <text x="40" y="462" opacity="0" textLength="510" lengthAdjust="spacingAndGlyphs"><set attributeName="opacity" to="1" begin="6.94s" fill="freeze"/><tspan fill="#6E7681">[</tspan><tspan fill="#58A6FF">*</tspan><tspan fill="#6E7681">] </tspan><tspan fill="#8B949E">Validating credential </tspan><tspan fill="#6E7681">........................</tspan></text>
  <text x="40" y="491" opacity="0" textLength="694" lengthAdjust="spacingAndGlyphs"><set attributeName="opacity" to="1" begin="8.06s" fill="freeze"/><tspan fill="#6E7681">[</tspan><tspan fill="#00C896">✓</tspan><tspan fill="#6E7681">] </tspan><tspan fill="#F0F6FC">Certified Ethical Hacker · C|EH v13 · EC-Council  </tspan><tspan fill="#00C896">ACCESS GRANTED</tspan></text>
  <text x="40" y="520" opacity="0"><set attributeName="opacity" to="1" begin="8.06s" fill="freeze"/><tspan fill="#00C896">alejandro</tspan><tspan fill="#8B949E">@</tspan><tspan fill="#58A6FF">sec</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#A371F7">~</tspan><tspan fill="#8B949E">$ </tspan></text>
