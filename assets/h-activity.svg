<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" role="img" aria-label="Activity">
  <title>Activity</title>
  <defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/><stop offset=".5" stop-color="#A371F7"/><stop offset="1" stop-color="#00C896"/>
    </linearGradient>
    <linearGradient id="fadeLine" gradientUnits="userSpaceOnUse" x1="242" y1="0" x2="1196" y2="0">
      <stop offset="0" stop-color="#58A6FF" stop-opacity=".7"/><stop offset=".5" stop-color="#A371F7" stop-opacity=".35"/><stop offset="1" stop-color="#00C896" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.6s .2s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .dot { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <text x="4" y="44" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#58A6FF">05</text>
  <text x="34" y="44" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#6E7681">//</text>
  <text x="62" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="url(#brand)" letter-spacing=".5" textLength="140" lengthAdjust="spacingAndGlyphs">Activity</text>
  <rect class="dot" x="210" y="24" width="12" height="26" rx="1" fill="#00C896"/>
  <text x="4" y="74" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#8B949E">commits, streaks &amp; a hungry snake</text>
  <line class="draw" x1="242" y1="37" x2="1196" y2="37" stroke="url(#fadeLine)" stroke-width="2" stroke-linecap="round"/>
</svg>
